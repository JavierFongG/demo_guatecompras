# Pruebas en cada pull request y push a main. Protege main con este check (Settings → Branches).
name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_call:          # también la usa "Desplegar API" antes de construir la imagen

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "backend/requirements-*.txt" }
      - run: pip install -r requirements-api.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund --no-audit
      - run: npm run build
