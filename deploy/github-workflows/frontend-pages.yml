# Publica el frontend en GitHub Pages (gratis). Alternativas equivalentes: Cloudflare Pages,
# Netlify o Vercel apuntando a la carpeta frontend/ (build: npm run build, salida: dist).
#
# Variable requerida (Settings → Secrets and variables → Actions → Variables):
#   VITE_API_BASE   URL pública de tu API, p. ej. https://guatecompras-api-xxxx.run.app
# Y en Settings → Pages: Source = GitHub Actions.
name: Frontend (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-pages.yml"]
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-fund --no-audit
      - run: npm run build
        env: { VITE_API_BASE: "${{ vars.VITE_API_BASE }}" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
